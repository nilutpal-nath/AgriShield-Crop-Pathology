            lng: 73.8567 + (Math.cos(i) * 0.002),
            shutter: '1/640s',
            lens: 'Phone Camera',
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          }
        });
      }
      return specimens;
    };

    // Major agricultural regions for 1-click weather checking
    const DISTRICT_PRESETS = [
      { id: 'gps', label: '📍 My Current GPS Location', lat: null, lon: null },
      { id: 'pune', label: 'Pune, Maharashtra', lat: 18.5204, lon: 73.8567 },
      { id: 'nashik', label: 'Nashik, Maharashtra', lat: 19.9975, lon: 73.7898 },
      { id: 'ratnagiri', label: 'Ratnagiri, Maharashtra', lat: 16.9902, lon: 73.3120 },
      { id: 'kolhapur', label: 'Kolhapur, Maharashtra', lat: 16.7050, lon: 74.2433 },
      { id: 'nagpur', label: 'Nagpur, Maharashtra', lat: 21.1458, lon: 79.0882 },
      { id: 'guntur', label: 'Guntur, Andhra Pradesh', lat: 16.3067, lon: 80.4365 },
      { id: 'bengaluru', label: 'Bengaluru / Kolar, Karnataka', lat: 12.9716, lon: 77.5946 },

      { id: 'guwahati', label: 'Guwahati, Assam', lat: 26.1445, lon: 91.7362 }
    ];

    // ==========================================
    // MAIN APP COMPONENT
    // ==========================================
    function App() {
      // Views: 'overview' | 'scanner' | 'records' | 'roi'
      const [currentView, setCurrentView] = useState('scanner');
      
      // Selected Crop: 'mango' | 'tomato' | 'potato' | 'chili' | 'others'
      const [selectedCrop, setSelectedCrop] = useState('mango');
      
      // Farm Area (Acreage) selector: 1 | 2 | 5 | 10 Acres
      const [farmAcreage, setFarmAcreage] = useState(1);
      
      // Farmer User & Profile Modal State
      const [farmerUser, setFarmerUser] = useState(() => {
        const saved = localStorage.getItem('AGRISHIELD_FARMER_USER_V2');
        return saved ? JSON.parse(saved) : {
          name: 'Ramesh Patil',
          phone: '+91 98231 45678',
          location: 'Pune / Nashik, Maharashtra',
          farmName: 'Patil Krishi Farm',
          isLoggedIn: true
        };
      });
      const [showFarmerModal, setShowFarmerModal] = useState(false);
      const [loginNameInput, setLoginNameInput] = useState('');
      const [loginPhoneInput, setLoginPhoneInput] = useState('');
      const [loginFarmInput, setLoginFarmInput] = useState('');

      // Backend Connection State
      const [backendOnline, setBackendOnline] = useState(false);
      const [backendInfo, setBackendInfo] = useState(null);
      const [isSyncing, setIsSyncing] = useState(false);
      
      // Batch Ingestion State - STARTS EMPTY AS REQUESTED
      const [uploadedLeaves, setUploadedLeaves] = useState([]);
      const [isDragging, setIsDragging] = useState(false);
      
      // AI Processing State (3 phases, 2s each)
      const [isProcessing, setIsProcessing] = useState(false);
      const [processingPhase, setProcessingPhase] = useState(1);
      const [processingProgress, setProcessingProgress] = useState(0);
      
      // Results & Database Save State
      const [diagnosticResult, setDiagnosticResult] = useState(null);
      const [hasSavedCurrentScan, setHasSavedCurrentScan] = useState(false);
      
      // Health Records State
      const [healthRecords, setHealthRecords] = useState([]);

      // Modals
      const [recoveryModalRecord, setRecoveryModalRecord] = useState(null);
      const [recoveryPhotos, setRecoveryPhotos] = useState([]);
      const [recoveryNotesInput, setRecoveryNotesInput] = useState('');
      const [recoveryEfficacy, setRecoveryEfficacy] = useState('remission');
      const [selectedRecordDetail, setSelectedRecordDetail] = useState(null);

      // Search & Filters
      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('ALL');
      const [cropFilter, setCropFilter] = useState('ALL');

      // Live Geolocation & Weather State
      const [liveWeather, setLiveWeather] = useState({
        location: 'Pune / Nashik, Maharashtra',
        temp: '28.4°C',
        humidity: '84%',
        humidityRisk: 'High Moisture - Fungus Risk High',
        tempNote: 'Optimal field temperature',
        condition: 'Humid & Overcast',
        geotag: '18.5204° N, 73.8567° E',
        isLive: false,
        isFetching: false,
        selectedDistrict: 'gps'
      });

      // Strict Validation: exactly 10 to 15 images
      const leafCount = uploadedLeaves.length;
      const isBatchValid = leafCount >= 10 && leafCount <= 15;
      const showBatchError = leafCount > 0 && !isBatchValid;

      // ==========================================
      // BACKEND API SYNC
      // ==========================================
      const fetchDatabaseRecords = useCallback(async () => {
        setIsSyncing(true);
        try {
          const res = await fetch(`${API_BASE}/health`, { method: 'GET' });
          if (res.ok) {
            const data = await res.json();
            setBackendOnline(true);
            setBackendInfo(data);
            
            const recRes = await fetch(`${API_BASE}/records`);
            if (recRes.ok) {
              const recJson = await recRes.json();
              if (recJson.data) {
                setHealthRecords(recJson.data);
                localStorage.setItem('AGRISHIELD_HEALTH_RECORDS_V2', JSON.stringify(recJson.data));
              }
            }
          } else {
            setBackendOnline(false);
          }
        } catch (e) {
          setBackendOnline(false);
          const cached = localStorage.getItem('AGRISHIELD_HEALTH_RECORDS_V2');
          if (cached) {
            try { setHealthRecords(JSON.parse(cached)); } catch(err) {}
          }
        } finally {
          setIsSyncing(false);
        }
      }, []);

      useEffect(() => {
        fetchDatabaseRecords();
        const interval = setInterval(fetchDatabaseRecords, 15000);
        return () => clearInterval(interval);
      }, [fetchDatabaseRecords]);

      // ==========================================
      // REAL-TIME GEOLOCATION & LIVE WEATHER FETCH
      // ==========================================
      const fetchRealLocationAndWeather = useCallback(async (presetId = 'gps') => {
        setLiveWeather(prev => ({ ...prev, isFetching: true, selectedDistrict: presetId }));
        try {
          let lat = 18.5204;
          let lon = 73.8567;
          let locName = 'Pune, Maharashtra';

          if (presetId !== 'gps') {
            const preset = DISTRICT_PRESETS.find(d => d.id === presetId);
            if (preset && preset.lat) {
              lat = preset.lat;
              lon = preset.lon;
              locName = preset.label;
            }
          } else {
            // HTML5 Browser Geolocation
            let gotGps = false;
            if (navigator.geolocation) {
              try {
                const pos = await new Promise((resolve, reject) => {
                  navigator.geolocation.getCurrentPosition(resolve, reject, {
                    timeout: 7000,
                    enableHighAccuracy: true
                  });
                });
                lat = pos.coords.latitude;
                lon = pos.coords.longitude;
                gotGps = true;
              } catch (geoErr) {
                console.log("Browser geolocation prompt bypassed or timed out", geoErr);
              }
            }

            // Reverse Geocode via BigDataCloud to obtain exact city & state
            try {
              const gRes = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
              if (gRes.ok) {
                const gData = await gRes.json();
                const city = gData.city || gData.locality || gData.principalSubdivision || "Field Location";
                const state = gData.principalSubdivision || "";
                locName = state ? `${city}, ${state}` : city;
              }
            } catch (ge) {
              locName = gotGps ? `Farm (${lat.toFixed(2)}°N, ${lon.toFixed(2)}°E)` : "Pune, Maharashtra";
            }
          }

          // Fetch Live Weather from Open-Meteo
          let tempStr = "28.4°C";
          let humStr = "82%";
          let humVal = 82;
          let condStr = "Clear & Warm";

          try {
            const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code`, { cache: 'no-store' });
            if (wRes.ok) {
              const wData = await wRes.json();
              const curr = wData.current || {};
              if (curr.temperature_2m !== undefined) {
                tempStr = `${Math.round(curr.temperature_2m * 10) / 10}°C`;
              }
              if (curr.relative_humidity_2m !== undefined) {
                humVal = Math.round(curr.relative_humidity_2m);
                humStr = `${humVal}%`;
              }
              const wCode = curr.weather_code || 0;
              if (wCode >= 51) condStr = "Light Rain / Damp Leaves";
              else if (wCode >= 45) condStr = "Morning Fog / High Moisture";
              else if (wCode >= 1) condStr = "Partly Cloudy";
              else condStr = "Sunny & Clear";
            }
          } catch (wErr) {
            // Backend proxy fallback
            try {
              const bRes = await fetch(`${API_BASE}/weather/live?lat=${lat}&lon=${lon}`);
              if (bRes.ok) {
                const bData = await bRes.json();
                tempStr = bData.temp;
                humStr = bData.humidity.split(' ')[0];
                humVal = parseInt(humStr) || 80;
                condStr = "Live Station Weather";
              }
            } catch (be) {}
          }

          const humRisk = humVal >= 80 
            ? "High Humidity - Fungus Spores Multiply Quickly" 
            : humVal >= 65 
            ? "Moderate Moisture - Keep Checking Leaves" 
            : "Low Moisture - Low Fungus Risk";

          const tempNote = parseFloat(tempStr) > 32 
            ? "High afternoon heat - spray in early morning" 
            : "Good temperature for plant health";

          setLiveWeather({
            location: locName,
            temp: tempStr,
            humidity: `${humStr} - ${humVal >= 80 ? 'High' : humVal >= 65 ? 'Moderate' : 'Normal'}`,
            humidityRisk: humRisk,
            tempNote: tempNote,
            condition: condStr,
            geotag: `${lat.toFixed(4)}° N, ${lon.toFixed(4)}° E`,
            isLive: true,
            isFetching: false,
            selectedDistrict: presetId
          });
        } catch (err) {
          console.error("fetchRealLocationAndWeather error", err);
          setLiveWeather(prev => ({ ...prev, isFetching: false, isLive: true }));
        }
      }, []);

      useEffect(() => {
        fetchRealLocationAndWeather('gps');
      }, [fetchRealLocationAndWeather]);

      // When selected crop changes: DO NOT inject fake specimens, keep empty state
      const handleSwitchCrop = (newCrop) => {
        setSelectedCrop(newCrop);
        setDiagnosticResult(null);
        setHasSavedCurrentScan(false);
      };

      // Optional button to load 12 demo leaves for fast user testing
      const handleLoadDemoBatch = () => {
        setUploadedLeaves(generateCropSpecimens(selectedCrop, 12));
      };

      const handleClearAllLeaves = () => {
        setUploadedLeaves([]);
        setDiagnosticResult(null);
      };

      // Process user uploaded images from file picker or drag-and-drop
      const processRawFiles = (files) => {
        let detectedCrop = selectedCrop;
        
        // Check filename for crop cues
        for (const file of files) {
          const fn = file.name.toLowerCase();
          if (fn.includes('mango') || fn.includes('alphonso') || fn.includes('mangifera')) {
            detectedCrop = 'mango';
            break;
          } else if (fn.includes('tomato') || fn.includes('solanaceae') || fn.includes('lycopersicum')) {
            detectedCrop = 'tomato';
            break;
          } else if (fn.includes('potato') || fn.includes('kufri') || fn.includes('tuberosum')) {
            detectedCrop = 'potato';
            break;
          } else if (fn.includes('chili') || fn.includes('chilli') || fn.includes('pepper') || fn.includes('capsicum')) {
            detectedCrop = 'chili';
            break;
          }
        }

        if (detectedCrop !== selectedCrop && selectedCrop !== 'others') {
          setSelectedCrop(detectedCrop);
        }

        const newSpecimens = files.map((file, idx) => {
          const objectUrl = URL.createObjectURL(file);
          return {
            id: `${detectedCrop}-user-upload-${Date.now()}-${idx}`,
            name: file.name,
            crop_code: detectedCrop,
            size: (file.size / (1024 * 1024)).toFixed(1) + ' MB',
            preview: objectUrl,
            variety: detectedCrop === 'mango' ? 'Mango (Alphonso)' : detectedCrop === 'tomato' ? 'Tomato' : detectedCrop === 'potato' ? 'Potato' : detectedCrop === 'chili' ? 'Chili' : 'Farm Crop',
            plot: 'Farmer Field Block',
            lesionCoverage: 'Visual Leaf Inspection',
            exif: {
              shutter: 'Standard Photo',
              lens: 'Phone Camera',
              timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            }
          };
        });

        setUploadedLeaves(prev => [...prev, ...newSpecimens]);
      };

      const handleFileSelect = (e) => {
        const files = Array.from(e.target.files || []);
        if (files.length === 0) return;
        processRawFiles(files);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        const files = Array.from(e.dataTransfer.files || []);
        if (files.length > 0) {
          processRawFiles(files);
        }
      };

      const handleRemoveLeaf = (idToRemove) => {
        setUploadedLeaves(prev => prev.filter(item => item.id !== idToRemove));
      };

      // ==========================================
      // RUN DIAGNOSTICS & AUTOMATIC SCROLL DOWN
      // ==========================================
      const handleRunDiagnostics = async () => {
        if (!isBatchValid) return;
        
        setIsProcessing(true);
        setProcessingPhase(1);
        setProcessingProgress(15);
        setDiagnosticResult(null);
        setHasSavedCurrentScan(false);

        // Phase 1 (0-2s)
        setTimeout(() => {
          setProcessingPhase(2);
          setProcessingProgress(48);
        }, 2000);

        // Phase 2 (2-4s)
        setTimeout(() => {
          setProcessingPhase(3);
          setProcessingProgress(82);
        }, 4000);

        // Phase 3 (4-6s)
        setTimeout(async () => {
          setProcessingProgress(100);

          let resultPayload = null;

          if (backendOnline) {
            try {
              const res = await fetch(`${API_BASE}/diagnose`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  crop_code: selectedCrop,
                  batch_size: uploadedLeaves.length,
                  acreage: farmAcreage,
                  location: liveWeather.location,
                  humidity: liveWeather.humidity,
                  temp: liveWeather.temp
                })
              });
              if (res.ok) {
                const apiData = await res.json();
                resultPayload = apiData.diagnosis;
              }
            } catch (err) {
              console.warn("Backend diagnose fallback", err);
            }
          }

          // If offline or fallback, construct diagnostic payload dynamically
          if (!resultPayload) {
            const isMango = selectedCrop === 'mango';
            const isPotato = selectedCrop === 'potato';
            const isTomato = selectedCrop === 'tomato';
            const isChili = selectedCrop === 'chili';

            const disease = isMango ? 'Mango Anthracnose' : isPotato ? 'Late Blight' : isTomato ? 'Early Blight' : isChili ? 'Chili Anthracnose & Dieback' : 'Fungal Leaf Spot & Blight';
            const pathogen = isMango ? 'Colletotrichum gloeosporioides' : isPotato ? 'Phytophthora infestans' : isTomato ? 'Alternaria solani' : isChili ? 'Colletotrichum capsici' : 'Cercospora / Alternaria Complex';
            const baseLoss = isMango ? 45000 : isPotato ? 28000 : isTomato ? 15000 : isChili ? 18000 : 14000;
            const yieldRisk = isMango ? 5.8 : isPotato ? 7.5 : isTomato ? 4.2 : isChili ? 3.8 : 3.2;

            const totalLoss = baseLoss * farmAcreage;
            const totalYield = (yieldRisk * farmAcreage).toFixed(1);
            const treatmentCost = (isMango ? 2400 : isPotato ? 1600 : isTomato ? 900 : isChili ? 1200 : 850) * farmAcreage;

            resultPayload = {
              id: 'REC-2026-' + Math.floor(1000 + Math.random() * 9000),
              crop_code: selectedCrop,
              scanDate: new Date().toISOString(),
              formattedDate: new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }),
              formattedTime: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              cropName: isMango ? 'Mango (Alphonso)' : isPotato ? 'Potato (Kufri)' : isTomato ? 'Tomato' : isChili ? 'Chili (G4)' : 'Farm Crops (General)',
              cropPlot: 'Farm Field Plot',
              diseaseName: disease,
              botanicalPathogen: pathogen,
              severityGrade: 'Stage 2 - Active Leaf Infection',
              severityIndex: '65.2%',
              confidenceRate: '98.2%',
              environmentalRootCause: `In ${liveWeather.location}, high humidity (${liveWeather.humidity.split(' ')[0]}) and ambient temperature (${liveWeather.temp}) created the optimal conditions for ${pathogen} fungal spores to germinate on your ${isMango ? 'Mango' : isPotato ? 'Potato' : isTomato ? 'Tomato' : isChili ? 'Chili' : 'crop'} leaves. Extended leaf surface wetness allowed the infection to penetrate leaf cuticles, causing dark lesions and spots to spread.`,
              treatmentPlan: {
                recommendedMedicine: isMango 
                  ? 'Azoxystrobin + Difenoconazole (Amistar Top)' 
                  : isPotato 
                  ? 'Dimethomorph 50% WP + Metalaxyl 8% WP' 
                  : isTomato 
                  ? 'Mancozeb 75% WP + Azoxystrobin SC' 
                  : isChili 
                  ? 'Tebuconazole 50% + Trifloxystrobin 25% WG (Nativo)' 
                  : 'Mancozeb 75% WP (or Neem Oil 10,000 PPM)',
                marketPrice: isMango ? '₹520 / Liter' : isPotato ? '₹480 / kg' : isTomato ? '₹450 / Liter' : isChili ? '₹650 / 100g' : '₹380 / kg',
                totalCostEstimate: `₹${treatmentCost.toLocaleString()} estimated for ${farmAcreage} acre${farmAcreage > 1 ? 's' : ''}`,
                steps: [
                  "1. Mix recommended medicine with clean water as written on the packet.",
                  "2. Spray early in the morning (06:00 - 08:30 AM) when wind is calm.",
                  "3. Spray thoroughly on both upper side and underside of all leaves.",
                  "4. Repeat spray after 10 to 12 days to protect new growing leaves."
                ],
                precautionsWhatNotToDo: [
                  "DO NOT spray during hot afternoon sun (above 30°C) which can burn leaves.",
                  "DO NOT spray if rain is expected within 3 hours (medicine will wash away).",
                  "DO NOT leave blackened fallen leaves on the ground; remove and burn them.",
                  "DO NOT use overhead sprinklers which splash fungus to healthy plants."
                ]
              },
              economicImpact: {
                acreage: farmAcreage,
                estimatedLossesIfUntreated: `₹${totalLoss.toLocaleString()} (${farmAcreage} Acre${farmAcreage > 1 ? 's' : ''})`,
                lossDetails: `Estimated crop value lost if disease continues spreading on ${farmAcreage} acre${farmAcreage > 1 ? 's' : ''}`,
                projectedYieldAtRisk: `${totalYield} MT Metric Tons`,
                roiRatio: isMango ? '1 : 18.8' : isPotato ? '1 : 17.5' : isTomato ? '1 : 16.5' : '1 : 15.0',
                roiComparisonText: `₹${treatmentCost.toLocaleString()} spray cost saves ~₹${totalLoss.toLocaleString()} worth of harvest produce`,
                strategies: [
                  {
                    title: "Targeted Perimeter Spray",
                    desc: "Spray the medicine 5 meters around infected plants first to stop fungus from jumping to healthy crops.",
                    impact: `Saves up to ₹${(baseLoss * 0.35 * farmAcreage).toLocaleString()} (${farmAcreage} Acres)`
                  },
                  {
                    title: "Lower Yellow Leaf Removal",
                    desc: "Cut off and remove dry and infected bottom leaves so fresh air and sunlight can dry the foliage.",
                    impact: `Saves up to ₹${(baseLoss * 0.18 * farmAcreage).toLocaleString()} (${farmAcreage} Acres)`
                  },
                  {
                    title: "Water Directly at Roots",
                    desc: "Water plants at the soil base using drip instead of overhead watering to keep leaves dry.",
                    impact: `Saves up to ₹${(baseLoss * 0.10 * farmAcreage).toLocaleString()} (${farmAcreage} Acres)`
                  }
                ]
              },
              batchSize: uploadedLeaves.length,
              weatherSnapshot: {
                location: liveWeather.location,
                temp: liveWeather.temp,
                humidity: liveWeather.humidity,
                condition: liveWeather.condition
              }
            };
          }

          setDiagnosticResult(resultPayload);
          setIsProcessing(false);

          // AUTO-SCROLL AUTOMATICALLY DOWN TO RESULTS SECTION
          setTimeout(() => {
            const resultsSection = document.getElementById('diagnostic-results-section');
            if (resultsSection) {
              resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 150);
        }, 6000);
      };

      // Real-time Acreage Dynamic Economics Calculator
      const computedEconomics = useMemo(() => {
        if (!diagnosticResult) return null;
        const ec = diagnosticResult.economicImpact || {};
        const cropCode = diagnosticResult.crop_code || selectedCrop || 'mango';
        const isMango = cropCode === 'mango' || (diagnosticResult.cropName && diagnosticResult.cropName.includes('Mango'));
        const isPotato = cropCode === 'potato' || (diagnosticResult.cropName && diagnosticResult.cropName.includes('Potato'));
        const isTomato = cropCode === 'tomato' || (diagnosticResult.cropName && diagnosticResult.cropName.includes('Tomato'));
        const isChili = cropCode === 'chili' || (diagnosticResult.cropName && diagnosticResult.cropName.includes('Chili'));

        const baseLoss = ec.baseLossPerAcre || (isMango ? 45000 : isPotato ? 28000 : isTomato ? 15000 : isChili ? 18000 : 14000);
        const baseYield = ec.baseYieldRiskPerAcre || (isMango ? 5.8 : isPotato ? 7.5 : isTomato ? 4.2 : isChili ? 3.8 : 3.2);
        const baseTreatment = ec.treatmentCostAcre || (isMango ? 2400 : isPotato ? 1600 : isTomato ? 900 : isChili ? 1200 : 850);
        const roiRatio = ec.roiRatio || (isMango ? '1 : 18.8' : isPotato ? '1 : 17.5' : isTomato ? '1 : 16.5' : '1 : 15.0');

        const totalLoss = baseLoss * farmAcreage;
        const totalYield = (baseYield * farmAcreage).toFixed(1);
        const totalTreatment = baseTreatment * farmAcreage;

        const lossBenchmark = ec.lossBenchmarkText || (
          isMango 
            ? 'Based on benchmark ₹45,000 / Acre loss for Alphonso mango orchard harvest'
            : isPotato
            ? 'Based on benchmark ₹28,000 / Acre loss for commercial potato tuber harvest'
            : isTomato
            ? 'Based on benchmark ₹15,000 / Acre loss for Solanaceae tomato harvest'
            : isChili
            ? 'Based on benchmark ₹18,000 / Acre loss for fresh green and dry red chili yield'
            : 'Based on benchmark ₹14,000 / Acre loss for field crop harvest'
        );

        const stratList = (ec.strategies && ec.strategies.length > 0) ? ec.strategies : [
          {
            title: isMango ? "Localized Barrier & Panicle Quarantine Spray" : "Targeted Perimeter Spray",
            desc: isMango ? "Apply systemic strobilurin curative fungicide to a 10-meter perimeter buffer around infected trees before airborne conidia spread to healthy orchard blocks." : "Spray curative medicine in a 5-meter buffer radius around infected plants before fungal spores blow to healthy crops.",
            baseSave: Math.round(baseLoss * 0.35)
          },
          {
            title: isMango ? "Post-Harvest Orchard Sanitation & Canopy Thinning" : "Lower Canopy Pruning & Leaf Removal",
            desc: isMango ? "Prune dead wood and inner criss-crossing branches to enhance sunlight penetration and drop microclimate humidity from 88% to 65%." : "Manually de-leaf bottom 15 cm of necrotic foliage and burn or bury debris off-field to halt horizontal splash propagation.",
            baseSave: Math.round(baseLoss * 0.18)
          },
          {
            title: isMango ? "Pre-Harvest Fruit Bagging & Drip Scheduling" : "Drip Irrigation Timing Calibration",
            desc: isMango ? "Switch from overhead misting to root-zone drip lines and bag developing fruits with brown parchment to block rain-splash inoculum." : "Switch from overhead misting to root-zone drip lines to keep foliage completely dry during humid evenings.",
            baseSave: Math.round(baseLoss * 0.10)
          }
        ];

        const strategies = stratList.map((s, idx) => {
          const baseSave = s.baseSave || (idx === 0 ? Math.round(baseLoss * 0.35) : idx === 1 ? Math.round(baseLoss * 0.18) : Math.round(baseLoss * 0.10));
          const totalSave = baseSave * farmAcreage;
          return {
            title: s.title,
            desc: s.desc,
            impact: `Saves up to ₹${totalSave.toLocaleString()} (${farmAcreage} Acre${farmAcreage > 1 ? 's' : ''})`
          };
        });

        return {
          potentialLoss: `₹${totalLoss.toLocaleString()} (${farmAcreage} Acre${farmAcreage > 1 ? 's' : ''})`,
          lossBenchmark,
          yieldAtRisk: `${totalYield} MT Metric Tons`,
          roiRatio,

          formatted_date: diagnosticResult.formattedDate,
          formatted_time: diagnosticResult.formattedTime,
          crop: diagnosticResult.cropName,
          plot: diagnosticResult.cropPlot,
          disease: diagnosticResult.diseaseName,
          pathogen: diagnosticResult.botanicalPathogen,
          severity: diagnosticResult.severityGrade,
          confidence: diagnosticResult.confidenceRate,
          location: diagnosticResult.weatherSnapshot.location,
          temperature: diagnosticResult.weatherSnapshot.temp,
          humidity: diagnosticResult.weatherSnapshot.humidity,
          weather_condition: diagnosticResult.weatherSnapshot.condition,
          status: 'Active Treatment',
          prescription: diagnosticResult.treatmentPlan.recommendedMedicine,
          batch_count: diagnosticResult.batchSize,
          acreage: farmAcreage,
          loss_estimate: computedEconomics ? computedEconomics.potentialLoss : diagnosticResult.economicImpact.estimatedLossesIfUntreated,
          notes: `Batch of ${diagnosticResult.batchSize} leaves analyzed for ${farmerUser.name}.`,
          recovery_uploaded: 0

          try {
            const res = await fetch(`${API_BASE}/records`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(recordPayload)
            });
            if (res.ok) {
              setHasSavedCurrentScan(true);
              fetchDatabaseRecords();
              return;
            }
          } catch (e) {
            console.warn("Backend save failed, writing to localStorage", e);
          }
        }

        // LocalStorage fallback
        setHealthRecords(prev => {
          const updated = [recordPayload, ...prev];
          localStorage.setItem('AGRISHIELD_HEALTH_RECORDS_V2', JSON.stringify(updated));
          return updated;
        });
        setHasSavedCurrentScan(true);
      };

        if (!recoveryModalRecord) return;
        const recId = recoveryModalRecord.id;

          try {
            const res = await fetch(`${API_BASE}/records/${recId}/recovery`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                status: recoveryEfficacy === 'remission' ? 'Resolved' : 'In Observation',
                notes: recoveryNotesInput || 'Recovery photos checked. Disease spots stopped growing; green healthy shoots appearing.',
                efficacy: recoveryEfficacy
              })
            });
            if (res.ok) {
              setRecoveryModalRecord(null);
              setRecoveryPhotos([]);
              setRecoveryNotesInput('');
              fetchDatabaseRecords();
              return;
            }
          } catch (e) {
            console.warn("Recovery update fallback", e);
          }
        }

        setHealthRecords(prev => {
          const updated = prev.map(r => {

                ...r,
                status: recoveryEfficacy === 'remission' ? 'Resolved' : 'In Observation',

            }
            return r;

        setRecoveryPhotos([]);
        setRecoveryNotesInput('');

                                </div>
                              </div>

                              <div className="flex-shrink-0 sm:text-right">
                                <span className="inline-block px-3 py-1 rounded-md text-xs font-bold bg-[#F0FDFA] text-[#0F766E] border border-[#0F766E]/20">
                                  {strategy.impact}
                                </span>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>

                    </div>

                  </div>
                )}

              </div>
            )}

            {/* ============================================================ */}
            {/* VIEW 3: SAVED FARM RECORDS (HISTORY VIEW) */}
            {/* ============================================================ */}
            {currentView === 'records' && (
              <div className="space-y-8 animate-fadeIn">
                
                {/* Header */}
                <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-4 border-b border-[#E5E7EB] gap-4">
                  <div>
                    <h1 className="text-3xl font-extrabold text-[#111827] tracking-tight font-heading">
                      Saved Farm Scans & History
                    </h1>
                    <p className="text-sm text-[#4B5563] mt-1">
                      Past crop scans saved in SQLite database with automated 4-day recovery follow-ups.
                    </p>
                  </div>

                  <div className="flex items-center space-x-3">
                    <button
                      type="button"
                      onClick={() => fetchDatabaseRecords()}
                      className="px-3.5 py-2 text-xs font-bold text-[#0F766E] bg-emerald-50 hover:bg-emerald-100 border border-emerald-300 rounded-xl transition-all flex items-center space-x-1.5 shadow-sm"
                    >
                      <IconRefreshCw className={`w-3.5 h-3.5 ${isSyncing ? 'animate-spin' : ''}`} />
                      <span>Sync Records</span>
                    </button>

                    <button
                      type="button"
                      onClick={() => setCurrentView('scanner')}
                      className="px-4 py-2 text-xs font-bold text-white bg-[#0F766E] hover:bg-[#0D645E] rounded-xl shadow-sm transition-all flex items-center space-x-1.5"
                    >
                      <IconSparkles className="w-3.5 h-3.5" />
                      <span>Start New Scan</span>
                    </button>
                  </div>
                </div>

                {/* Follow-up Alert Box */}
                {followUpCount > 0 && (
                  <div className="p-4 rounded-2xl bg-amber-50 border-2 border-amber-300 flex items-start space-x-3.5 shadow-sm">
                    <div className="p-2 rounded-xl bg-amber-500 text-white mt-0.5">
                      <IconClock className="w-5 h-5 stroke-[2.5]" />
                    </div>
                    <div className="flex-1 text-sm">
                      <div className="font-extrabold text-amber-900 text-base">
                        ⚠️ 4-Day Recovery Check Required ({followUpCount} Scan Waiting)
                      </div>
                      <p className="text-xs text-amber-800 mt-0.5 leading-relaxed">
                        It has been 4 days since spray medicine was prescribed for your crop. Please click "Upload Recovery Photos" to verify if the leaf disease has stopped.
                      </p>
                    </div>
                  </div>
                )}

                {/* Filter and Search Bar */}
                <div className="bg-white rounded-2xl border border-[#E5E7EB] p-4 shadow-sm flex flex-col md:flex-row items-center justify-between gap-3">
                  <div className="relative w-full md:w-80">
                    <IconSearch className="w-4 h-4 text-gray-400 absolute left-3 top-3" />
                    <input
                      type="text"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      placeholder="Search by disease, crop, or plot..."
                      className="w-full pl-9 pr-3 py-2 text-xs rounded-xl bg-[#FAFAFA] border border-[#E5E7EB] focus:outline-none focus:border-[#0F766E]"
                    />
                  </div>

                  <div className="flex flex-wrap items-center gap-2 w-full md:w-auto">
                    {/* Crop Filter */}
                    <select
                      value={cropFilter}
                      onChange={(e) => setCropFilter(e.target.value)}
                      className="text-xs font-semibold px-3 py-2 rounded-xl bg-[#FAFAFA] border border-[#E5E7EB] text-[#4B5563]"
                    >
                      <option value="ALL">All Crops</option>
                      <option value="mango">Mango 🥭</option>
                      <option value="tomato">Tomato 🍅</option>
                      <option value="potato">Potato 🥔</option>
                      <option value="chili">Chili 🌶️</option>
                      <option value="others">Others 🌱</option>
                    </select>

                    {/* Status Filter */}
                    <select
                      value={statusFilter}
                      onChange={(e) => setStatusFilter(e.target.value)}
                      className="text-xs font-semibold px-3 py-2 rounded-xl bg-[#FAFAFA] border border-[#E5E7EB] text-[#4B5563]"
                    >
                      <option value="ALL">All Statuses</option>
                      <option value="FOLLOW_UP_REQUIRED">Follow-up Due (3-5 Days)</option>
                      <option value="ACTIVE">Active Treatment</option>
                      <option value="RESOLVED">Resolved</option>
                    </select>
                  </div>
                </div>

                {/* Records Table */}
                <div className="bg-white rounded-2xl border border-[#E5E7EB] overflow-hidden shadow-sm">
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs text-[#111827]">
                      <thead className="bg-[#F9FAFB] border-b border-[#E5E7EB] text-[#4B5563] font-bold uppercase tracking-wider text-[11px]">
                        <tr>
                          <th className="py-3.5 px-4">Date & Scan ID</th>
                          <th className="py-3.5 px-4">Crop & Plot</th>
                          <th className="py-3.5 px-4">Identified Disease</th>
                          <th className="py-3.5 px-4">Prescribed Medicine</th>
                          <th className="py-3.5 px-4">Status & Action</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#E5E7EB]">
                        {filteredRecords.length > 0 ? (
                          filteredRecords.map((rec) => {
                            const daysAgo = Math.floor((Date.now() - new Date(rec.date).getTime()) / (1000 * 60 * 60 * 24));
                            const isFollowUpDue = daysAgo >= 3 && daysAgo <= 5 && rec.status !== 'Resolved';

                            return (
                              <tr key={rec.id} className="hover:bg-[#FAFAFA] transition-colors">
                                <td className="py-4 px-4 whitespace-nowrap">
                                  <div className="font-bold text-[#111827]">{rec.formatted_date || rec.date}</div>
                                  <div className="text-[11px] font-mono text-[#4B5563]">{rec.id}</div>
                                </td>
                                <td className="py-4 px-4">
                                  <div className="font-bold text-[#111827]">{rec.crop}</div>
                                  <div className="text-[11px] text-[#4B5563]">{rec.plot}</div>
                                </td>
                                <td className="py-4 px-4">
                                  <div className="font-bold text-red-800">{rec.disease}</div>
                                  <div className="text-[11px] italic text-[#4B5563]">{rec.pathogen}</div>
                                </td>
                                <td className="py-4 px-4">
                                  <div className="font-semibold text-[#0F766E]">{rec.prescription}</div>
                                  <div className="text-[11px] text-[#4B5563]">{rec.loss_estimate}</div>
                                </td>
                                <td className="py-4 px-4 whitespace-nowrap">
                                  {isFollowUpDue ? (
                                    <div className="space-y-1.5">
                                      <span className="inline-flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-900 border border-amber-300 animate-pulse">
                                        <IconClock className="w-3.5 h-3.5 text-amber-600" />
                                        <span>Follow-up Due ({daysAgo} Days Ago)</span>
                                      </span>
                                      <div>
                                        <button
                                          type="button"
                                          onClick={() => setRecoveryModalRecord(rec)}
                                          className="px-3 py-1.5 rounded-lg text-xs font-bold text-white bg-amber-600 hover:bg-amber-700 shadow-sm transition-all"
                                        >
                                          📷 Upload Recovery Photos
                                        </button>
                                      </div>
                                    </div>
                                  ) : rec.status === 'Resolved' ? (
                                    <span className="inline-flex items-center space-x-1 px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-300">
                                      <IconCheckCircle className="w-3.5 h-3.5 text-emerald-600" />
                                      <span>Resolved ({rec.recovery_date || 'Recovered'})</span>
                                    </span>
                                  ) : (
                                    <span className="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold bg-blue-50 text-blue-800 border border-blue-200">
                                      Active Treatment
                                    </span>
                                  )}
                                </td>
                              </tr>
                            );
                          })
                        ) : (
                          <tr>
                            <td colSpan="5" className="py-8 text-center text-xs text-[#4B5563]">
                              No scans found matching your search.
                            </td>
                          </tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>
            )}

            {/* ============================================================ */}
            {/* VIEW 4: PRICING & ROI (SAVINGS CALCULATOR) */}
            {/* ============================================================ */}
            {currentView === 'roi' && (
              <div className="space-y-8 animate-fadeIn">
                <div className="pb-4 border-b border-[#E5E7EB]">
                  <h1 className="text-3xl font-extrabold text-[#111827] tracking-tight font-heading">
                    Farm Profit & Spray Savings Calculator
                  </h1>
                  <p className="text-sm text-[#4B5563] mt-1">
                    See how much money you save by treating crop disease early compared to losing harvest tons.
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  <div className="bg-white rounded-2xl border border-[#E5E7EB] p-6 space-y-3 shadow-sm">
                    <div className="text-xs font-bold uppercase text-[#0F766E]">Small Farm (1-2 Acres)</div>
                    <div className="text-3xl font-extrabold text-[#111827] font-heading">₹30,000+</div>
                    <p className="text-xs text-[#4B5563] leading-relaxed">
                      Average crop loss prevented per season with timely spray on tomato, potato, or mango.
                    </p>
                    <div className="pt-2">
                      <span className="px-3 py-1 text-xs font-bold bg-emerald-50 text-emerald-800 rounded-lg">
                        1 : 16.5 Profit Ratio
                      </span>
                    </div>
                  </div>

                  <div className="bg-white rounded-2xl border-2 border-[#0F766E] p-6 space-y-3 shadow-md relative">
                    <span className="absolute top-3 right-3 text-[10px] font-bold uppercase bg-[#0F766E] text-white px-2 py-0.5 rounded-full">
                      Most Common
                    </span>
                    <div className="text-xs font-bold uppercase text-[#0F766E]">Commercial Farm (5 Acres)</div>
                    <div className="text-3xl font-extrabold text-[#111827] font-heading">₹1,50,000+</div>
                    <p className="text-xs text-[#4B5563] leading-relaxed">
                      Yield loss prevented across 5 acres with perimeter quarantine and ICAR-verified medicines.
                    </p>
                    <div className="pt-2">
                      <span className="px-3 py-1 text-xs font-bold bg-emerald-50 text-emerald-800 rounded-lg">
                        1 : 18.8 Profit Ratio
                      </span>
                    </div>
                  </div>

                  <div className="bg-white rounded-2xl border border-[#E5E7EB] p-6 space-y-3 shadow-sm">
                    <div className="text-xs font-bold uppercase text-[#0F766E]">Large Orchard (10+ Acres)</div>
                    <div className="text-3xl font-extrabold text-[#111827] font-heading">₹4,50,000+</div>
                    <p className="text-xs text-[#4B5563] leading-relaxed">
                      High-value Alphonso mango or potato harvest protected against severe anthracnose or late blight.
                    </p>
                    <div className="pt-2">
                      <span className="px-3 py-1 text-xs font-bold bg-emerald-50 text-emerald-800 rounded-lg">
                        1 : 20.2 Profit Ratio
                      </span>
                    </div>
                  </div>
                </div>

                <div className="text-center pt-4">
                  <button
                    type="button"
                    onClick={() => setCurrentView('scanner')}
                    className="px-6 py-3.5 text-sm font-bold text-white bg-[#0F766E] hover:bg-[#0D645E] rounded-xl shadow-md transition-all"
                  >
                    🌿 Start Leaf Scan on Your Farm
                  </button>
                </div>
              </div>
            )}

          </main>

          {/* ============================================================ */}
          {/* AI PROCESSING OVERLAY (6 SECONDS CYCLING ANIMATION) */}
          {/* ============================================================ */}
          {isProcessing && (
            <div className="fixed inset-0 z-50 bg-[#111827]/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl border border-[#E5E7EB] max-w-md w-full p-8 shadow-2xl space-y-6 text-center animate-fadeIn">
                
                {/* Progress Wheel */}
                <div className="relative w-24 h-24 mx-auto">
                  <div className="w-full h-full rounded-full border-4 border-gray-100"></div>
                  <div 
                    className="absolute inset-0 rounded-full border-4 border-[#0F766E] border-t-transparent animate-spin"
                    style={{ animationDuration: '1.2s' }}
                  ></div>
                  <div className="absolute inset-0 flex items-center justify-center font-bold text-lg text-[#0F766E] font-heading">
                    {processingProgress}%
                  </div>
                </div>

                {/* 3 Processing Phases in Simple Farmer Language */}
                <div className="space-y-2">
                  {processingPhase === 1 && (
                    <div className="space-y-1 animate-fadeIn">
                      <h3 className="text-xl font-bold text-[#111827] font-heading">
                        1. Cleaning and checking leaf photos...
                      </h3>
                      <p className="text-xs text-[#4B5563]">
                        Checking leaf spots and veins across your {uploadedLeaves.length} {selectedCrop.toUpperCase()} photos.
                      </p>
                    </div>
                  )}

                  {processingPhase === 2 && (
                    <div className="space-y-1 animate-fadeIn">
                      <h3 className="text-xl font-bold text-[#111827] font-heading">
                        2. Checking field weather & humidity...
                      </h3>
                      <p className="text-xs text-[#4B5563]">
                        Matching with {liveWeather.location} live weather ({liveWeather.temp}, {liveWeather.humidity}).
                      </p>
                    </div>
                  )}

                  {processingPhase === 3 && (
                    <div className="space-y-1 animate-fadeIn">
                      <h3 className="text-xl font-bold text-[#111827] font-heading">
                        3. Identifying disease & spray medicine...
                      </h3>
                      <p className="text-xs text-[#4B5563]">
                        Finding exact disease name and calculating spray steps to protect your yield.
                      </p>
                    </div>
                  )}
                </div>

                {/* Progress Bar */}
                <div className="w-full bg-gray-100 h-2 rounded-full overflow-hidden">
                  <div 
                    className="h-full bg-[#0F766E] transition-all duration-300"
                    style={{ width: `${processingProgress}%` }}
                  ></div>
                </div>

                <p className="text-[11px] text-[#4B5563]">
                  Please wait a moment while the crop doctor analyzes your batch...
                </p>
              </div>
            </div>
          )}

          {/* ============================================================ */}
          {/* FARMER ACCOUNT & LOGIN MODAL (REPLACES BOOK PILOT) */}
          {/* ============================================================ */}
          {showFarmerModal && (
            <div className="fixed inset-0 z-50 bg-[#111827]/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl border border-[#E5E7EB] max-w-md w-full p-6 sm:p-8 shadow-2xl space-y-5 animate-fadeIn">
                
                {/* Header */}
                <div className="flex items-center justify-between pb-3 border-b border-[#E5E7EB]">
                  <div className="flex items-center space-x-2">
                    <div className="w-8 h-8 rounded-lg bg-emerald-100 text-[#0F766E] flex items-center justify-center">
                      <IconUser className="w-4 h-4" />
                    </div>
                    <h3 className="text-lg font-bold text-[#111827] font-heading">Farmer Account & History</h3>
                  </div>
                  <button
                    type="button"
                    onClick={() => setShowFarmerModal(false)}
                    className="w-8 h-8 rounded-full bg-[#F3F4F6] text-[#4B5563] hover:text-[#111827] flex items-center justify-center"
                  >
                    <IconX className="w-4 h-4" />
                  </button>
                </div>

                {/* Farmer Profile Card */}
                <div className="p-4 rounded-2xl bg-emerald-50/70 border border-emerald-200 space-y-3">
                  <div className="flex items-center justify-between">
                    <div>
                      <div className="text-xs font-bold text-emerald-800 uppercase tracking-wider">Logged in as:</div>
                      <div className="text-lg font-extrabold text-emerald-950">{farmerUser.name}</div>
                      <div className="text-xs text-emerald-800">{farmerUser.phone} • {farmerUser.location}</div>
                    </div>
                    <span className="px-2.5 py-1 text-xs font-bold bg-emerald-200 text-emerald-900 rounded-full">
                      Active Farmer
                    </span>
                  </div>

                  <div className="pt-2 border-t border-emerald-200/60 flex items-center justify-between text-xs font-semibold text-emerald-900">
                    <span>Saved Scans: {healthRecords.length} Scans</span>
                    <span>Pending Follow-ups: {followUpCount}</span>
                  </div>
                </div>

                {/* Direct Actions for Farmer */}
                <div className="space-y-2.5">
                  <button
                    type="button"
                    onClick={() => {
                      setShowFarmerModal(false);
                      setCurrentView('records');
                    }}
                    className="w-full py-3 px-4 font-bold text-xs sm:text-sm text-white bg-[#0F766E] hover:bg-[#0D645E] rounded-xl shadow-md transition-all flex items-center justify-center space-x-2"
                  >
                    <IconDatabase className="w-4 h-4" />
                    <span>📂 Open My Saved Scans History ({healthRecords.length})</span>
                  </button>

                  <button
                    type="button"
                    onClick={() => {
                      setShowFarmerModal(false);
                      setCurrentView('scanner');
                    }}
                    className="w-full py-3 px-4 font-semibold text-xs sm:text-sm text-[#111827] bg-[#F3F4F6] hover:bg-[#E5E7EB] rounded-xl transition-all flex items-center justify-center space-x-2"
                  >
                    <IconCamera className="w-4 h-4" />
                    <span>🌿 Start New Crop Leaf Scan</span>
                  </button>
                </div>

                {/* Switch Farmer Details Form */}
                <div className="pt-3 border-t border-[#E5E7EB] space-y-3">
                  <h4 className="text-xs font-bold uppercase text-[#4B5563]">Change Farmer Details:</h4>
                  <form
                    onSubmit={(e) => {
                      e.preventDefault();
                      const updated = {
                        name: loginNameInput || farmerUser.name,
                        phone: loginPhoneInput || farmerUser.phone,
                        location: loginFarmInput || farmerUser.location,
                        farmName: farmerUser.farmName,
                        isLoggedIn: true
                      };
                      setFarmerUser(updated);
                      localStorage.setItem('AGRISHIELD_FARMER_USER_V2', JSON.stringify(updated));
                      setShowFarmerModal(false);
                    }}
                    className="space-y-2.5 text-xs"
                  >
                    <input
                      type="text"
                      placeholder={`Farmer Name (e.g. ${farmerUser.name})`}
                      value={loginNameInput}
                      onChange={(e) => setLoginNameInput(e.target.value)}
                      className="w-full p-2.5 bg-[#FAFAFA] border border-[#E5E7EB] rounded-xl"
                    />
                    <input
                      type="text"
                      placeholder={`Mobile Number (e.g. ${farmerUser.phone})`}
                      value={loginPhoneInput}
                      onChange={(e) => setLoginPhoneInput(e.target.value)}
                      className="w-full p-2.5 bg-[#FAFAFA] border border-[#E5E7EB] rounded-xl"
                    />
                    <input
                      type="text"
                      placeholder={`District / State (e.g. ${farmerUser.location})`}
                      value={loginFarmInput}
                      onChange={(e) => setLoginFarmInput(e.target.value)}
                      className="w-full p-2.5 bg-[#FAFAFA] border border-[#E5E7EB] rounded-xl"
                    />
                    <button
                      type="submit"
                      className="w-full py-2.5 font-bold text-xs text-[#0F766E] bg-emerald-50 hover:bg-emerald-100 border border-emerald-300 rounded-xl transition-all"
                    >
                      Update Profile
                    </button>
                  </form>
                </div>

              </div>
            </div>
          )}

          {/* ============================================================ */}
          {/* RECOVERY MODAL FOR 4-DAY FOLLOW-UP */}
          {/* ============================================================ */}
          {recoveryModalRecord && (
            <div className="fixed inset-0 z-50 bg-[#111827]/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl border border-[#E5E7EB] max-w-lg w-full p-6 sm:p-8 shadow-2xl space-y-5 animate-fadeIn">
                <div className="flex items-center justify-between pb-3 border-b border-[#E5E7EB]">
                  <div>
                    <h3 className="text-lg font-bold text-[#111827] font-heading">
                      Upload 4-Day Recovery Photos
                    </h3>
                    <p className="text-xs text-[#4B5563]">
                      Scan: {recoveryModalRecord.id} • {recoveryModalRecord.crop}
                    </p>
                  </div>
                  <button
                    type="button"
                    onClick={() => setRecoveryModalRecord(null)}
                    className="w-8 h-8 rounded-full bg-[#F3F4F6] text-[#4B5563] flex items-center justify-center"
                  >
                    <IconX className="w-4 h-4" />
                  </button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-[#111827]">Current Leaf Status after Spraying:</label>
                    <select
                      value={recoveryEfficacy}
                      onChange={(e) => setRecoveryEfficacy(e.target.value)}
                      className="w-full mt-1 p-2.5 bg-[#FAFAFA] border border-[#E5E7EB] rounded-xl font-semibold text-xs"
                    >
                      <option value="remission">Fungus Stopped • Leaves Recovering (Mark as Resolved)</option>
                      <option value="observation">Spots Still Visible • Keep in Observation</option>
                    </select>
                  </div>

                  <div>
                    <label className="font-bold text-[#111827]">Farmer Field Notes:</label>
                    <textarea
                      rows="3"
                      value={recoveryNotesInput}
                      onChange={(e) => setRecoveryNotesInput(e.target.value)}
                      placeholder="e.g. Sprayed medicine 4 days ago. Leaf spots dried up, new green leaf shoots growing healthy."
                      className="w-full mt-1 p-2.5 bg-[#FAFAFA] border border-[#E5E7EB] rounded-xl text-xs"
                    ></textarea>
                  </div>

                  <div className="p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-900 text-xs font-medium">
                    Uploading follow-up photos saves directly to SQLite database and turns the flashing amber alert to green Resolved.
                  </div>

                  <button
                    type="button"
                    onClick={handleSaveRecoverySubmission}
                    className="w-full py-3 font-bold text-white bg-[#0F766E] hover:bg-[#0D645E] rounded-xl shadow-md transition-all"
                  >
                    Confirm Recovery & Update Database
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ============================================================ */}
          {/* FOOTER */}
          {/* ============================================================ */}
          <footer className="bg-white border-t border-[#E5E7EB] py-6 mt-auto">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-[#4B5563]">
              <div className="flex items-center space-x-2">
                <div className="w-5 h-5 rounded-md bg-[#0F766E] text-white flex items-center justify-center">
                  <IconShield className="w-3 h-3 text-white" />
                </div>
                <span className="font-bold text-[#111827]">AGRISHIELD Smart Crop Doctor</span>
                <span>• Multi-Crop Edition (Mango, Tomato, Potato, Chili, Others)</span>
              </div>
              <div className="flex items-center space-x-3">
                <span className={`inline-block w-2 h-2 rounded-full ${backendOnline ? 'bg-emerald-500' : 'bg-amber-500'}`}></span>
                <span>{backendOnline ? 'SQLite Database Connected' : 'Local Fallback Storage Active'}</span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
